<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153c35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carnet Courses Test">
  <title>Mon Carnet — Intégration V1.0 TEST</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f1e8}
    iframe{display:block;width:100%;height:100%;border:0;background:#f6f1e8}
    #status{position:fixed;inset:0;display:grid;place-items:center;padding:24px;color:#17211e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f1e8;z-index:2;text-align:center}
  </style>
</head>
<body>
  <div id="status">Ouverture de Mon Carnet — Intégration V1.0 TEST…</div>
  <iframe id="carnet" src="./index.html?v=integration-v1" title="Mon Carnet — Intégration V1.0 TEST"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('carnet');
      const status = document.getElementById('status');
      let attempts = 0;

      function install() {
        attempts += 1;
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.body || !doc.querySelector('.topbar')) throw new Error('Application en cours de chargement');
          if (!doc.getElementById('mcIntegrationScript')) {
            const script = doc.createElement('script');
            script.id = 'mcIntegrationScript';
            script.src = './integration-v1.js?v=1.0.0';
            doc.head.appendChild(script);
          }
          status.style.display = 'none';
        } catch (_) {
          if (attempts < 80) window.setTimeout(install, 250);
          else status.textContent = 'Le module de test n’a pas pu être chargé. Rechargez la page.';
        }
      }

      frame.addEventListener('load', () => {
        attempts = 0;
        window.setTimeout(install, 100);
      });
      window.setTimeout(install, 500);
    })();
  </script>
</body>
</html>
