<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>Mon Carnet V2.3.5 TEST</title>
<style>
html,body{min-height:100%;margin:0;background:#f6f1e8;color:#17211e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center}
.boot strong{font-size:1.35rem}.boot p{color:#68736f;line-height:1.45}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Mon Carnet V2.3.5 TEST</strong><p>Ouverture de la version de test séparée…</p></div></div>
<script>
(async()=>{
'use strict';

const COMMIT='37d94ca01fb1694a131c1e452b2da56ba739c8e9';
const SOURCES=[
  `https://cdn.jsdelivr.net/gh/Ferdinand373/Mon-carnet-de-cuisine@${COMMIT}/index.html?v=235test`,
  `https://raw.githubusercontent.com/Ferdinand373/Mon-carnet-de-cuisine/${COMMIT}/index.html?v=235test`
];

let source='';
for(const url of SOURCES){
  try{
    const response=await fetch(url,{cache:'no-store'});
    if(response.ok){
      const text=await response.text();
      if(text.includes('Mon carnet de cuisine')){source=text;break;}
    }
  }catch{}
}

if(!source){
  document.getElementById('boot').innerHTML=
    '<div><strong>Mon Carnet TEST ne peut pas s’ouvrir.</strong><p>Vérifiez la connexion, puis rechargez la page.</p></div>';
  return;
}

/* Identification nette de la version de test */
source=source
  .replaceAll('V2.3.4','V2.3.5 TEST')
  .replaceAll('Mon carnet de cuisine — V2.3.4','Mon carnet de cuisine — V2.3.5 TEST');

/* 1. Clair Courses officiel uniquement */
source=source.replaceAll(
  'https://ferdinand373.github.io/clair-courses-test/',
  'https://ferdinand373.github.io/clair-courses/'
);
source=source.replaceAll(
  'const configured = (settings.clairUrl || DEFAULT_CLAIR_URL).trim();',
  'const configured = DEFAULT_CLAIR_URL;'
);

/* 2. Ajouter « Ce midi » avant 14 h */
source=source.replace(
  '<button class="btn btn-primary" type="button" data-schedule-slot="today-evening">Ce soir</button>',
  '<button class="btn btn-primary" type="button" data-schedule-slot="today-lunch">Ce midi</button>\n        <button class="btn btn-primary" type="button" data-schedule-slot="today-evening">Ce soir</button>'
);

source=source.replace(
  "if (slot === 'today-evening') return { date: today, meal: 'soir' };",
  "if (slot === 'today-lunch') return { date: today, meal: 'midi' };\n        if (slot === 'today-evening') return { date: today, meal: 'soir' };"
);

source=source.replace(
  "$('#customSchedulePanel').classList.remove('open');\n        $('#customScheduleDate').min = todayISO();",
  "$('#customSchedulePanel').classList.remove('open');\n        const todayLunchButton = document.querySelector('[data-schedule-slot=\"today-lunch\"]');\n        if (todayLunchButton) todayLunchButton.hidden = new Date().getHours() >= 14;\n        $('#customScheduleDate').min = todayISO();"
);

/* 3. Badge visible de test */
source=source.replace(
  '</body>',
  `<script>
  (()=>{try{
    document.title='Mon Carnet V2.3.5 TEST';
    const brandSmall=document.querySelector('.brand small');
    if(brandSmall) brandSmall.textContent='V2.3.5 TEST';
  }catch{}})();
  <\/script></body>`
);

document.open();
document.write(source);
document.close();
})();
</script>
</body>
</html>
