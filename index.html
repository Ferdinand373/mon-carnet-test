<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153c35">
<title>Mon Carnet V2.4.8 TEST</title>
<style>
:root{--paper:#f6f1e8;--ink:#17211e;--muted:#68736f;--card:#fffdf8;--line:rgba(23,33,30,.13);--bad:#8b3c35}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{display:grid;min-height:100vh;place-items:center;padding:24px}
.card{width:min(590px,100%);padding:24px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 16px 46px rgba(35,42,39,.12);text-align:center}
strong{display:block;font-size:1.35rem} p{color:var(--muted);line-height:1.5}
.error strong{color:var(--bad)} pre{white-space:pre-wrap;text-align:left;padding:12px;border-radius:14px;background:#f1ebe2;font-size:12px}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="card"><strong>Mon Carnet V2.4.8 TEST</strong><p>Contrôle et ouverture de la version de test…</p></div></div>
<script>
(async () => {
'use strict';

const BASE_COMMIT = '37d94ca01fb1694a131c1e452b2da56ba739c8e9';
const OFFICIAL_CLAIR_URL = 'https://raw.githack.com/Ferdinand373/clair-courses-test/e2ac1bdedc9bdff7605c01501e364f61ded67d6e/';
const OFFICIAL_ASSET_BASE = 'https://ferdinand373.github.io/Mon-carnet-de-cuisine/';
const SOURCES = [
  `https://cdn.jsdelivr.net/gh/Ferdinand373/Mon-carnet-de-cuisine@${BASE_COMMIT}/index.html?v=248-union-v112`,
  `https://raw.githubusercontent.com/Ferdinand373/Mon-carnet-de-cuisine/${BASE_COMMIT}/index.html?v=248-union-v112`
];


function patchSource(input) {
  let source = String(input || '');
  const checks = [];

  const requireMarker = (label, marker) => {
    const ok = source.includes(marker);
    checks.push({ label, ok });
    return ok;
  };

  const insertAfter = (label, marker, addition, fromIndex = 0) => {
    const index = source.indexOf(marker, fromIndex);
    if (index < 0) {
      checks.push({ label, ok: false });
      return -1;
    }
    const position = index + marker.length;
    source = source.slice(0, position) + addition + source.slice(position);
    checks.push({ label, ok: true });
    return position + addition.length;
  };

  const replaceExact = (label, marker, replacement, fromIndex = 0) => {
    const index = source.indexOf(marker, fromIndex);
    if (index < 0) {
      checks.push({ label, ok: false });
      return -1;
    }
    source = source.slice(0, index) + replacement + source.slice(index + marker.length);
    checks.push({ label, ok: true });
    return index + replacement.length;
  };

  /* Identification nette de la version de test. */
  source = source
    .replaceAll('Mon carnet de cuisine — V2.3.4', 'Mon carnet de cuisine — V2.4.8 TEST')
    .replaceAll('Collection personnelle · V2.3.4', 'VERSION · V2.4.8 TEST')
    .replaceAll('VERSION STABILISÉE · V2.3.5', 'VERSION · V2.4.8 TEST')
    .replaceAll('VERSION · TEST IPHONE 7.2 TITRES CORRIGÉS', 'VERSION · V2.4.8 TEST');

  /* Clair Courses officiel uniquement. */
  source = source.replaceAll(
    'https://ferdinand373.github.io/clair-courses-test/',
    OFFICIAL_CLAIR_URL
  );
  source = source.replace(
    /const DEFAULT_CLAIR_URL\s*=\s*['"][^'"]*clair-courses[^'"]*['"];/,
    `const DEFAULT_CLAIR_URL = '${OFFICIAL_CLAIR_URL}';`
  );
  source = source.replaceAll(
    'const configured = (settings.clairUrl || DEFAULT_CLAIR_URL).trim();',
    'const configured = DEFAULT_CLAIR_URL;'
  );
  source = source.replaceAll(
    "$('#clairUrl').value = settings.clairUrl || '';",
    "$('#clairUrl').value = DEFAULT_CLAIR_URL;"
  );

  /* Ne jamais charger les compléments depuis l’ancien dépôt de test. */
  source = source.replace(
    /<script([^>]*?)src=["']\.\/([^"']+)["']([^>]*)><\/script>/gi,
    (_match, before, file, after) =>
      `<script${before}src="${OFFICIAL_ASSET_BASE}${file}"${after}><\/script>`
  );

  /* Pas de service worker dans cette page de test séparée. */
  source = source.replaceAll(
    "navigator.serviceWorker.register('./sw.js?v=2.3.4').catch(() => {});",
    "Promise.resolve();"
  );

  /* 1. Titre de la planification sur l’accueil. */
  replaceExact(
    'titre de la planification',
    '<h3>Ce soir et demain</h3>',
    '<h3 id="homeUpcomingTitle">Ce midi, ce soir et demain</h3>'
  );

  /* 2. Ajout de Ce midi dans renderHome sans dépendre des espaces du fichier. */
  const renderHomeIndex = source.indexOf('function renderHome()');
  if (renderHomeIndex < 0) {
    checks.push({ label: 'fonction renderHome', ok: false });
  } else {
    checks.push({ label: 'fonction renderHome', ok: true });

    const upcomingStart = source.indexOf('const upcoming = [', renderHomeIndex);
    const upcomingBoundary = upcomingStart < 0
      ? -1
      : source.indexOf('const firstPlanned =', upcomingStart);

    if (upcomingStart < 0 || upcomingBoundary < 0) {
      checks.push({ label: 'bloc upcoming de l’accueil', ok: false });
    } else {
      const replacement = `const showTodayLunch = new Date().getHours() < 14;
        const upcoming = [
          ...(showTodayLunch ? [{ date: today, meal: 'midi' }] : []),
          { date: today, meal: 'soir' },
          { date: addDays(today, 1), meal: 'midi' },
          { date: addDays(today, 1), meal: 'soir' },
          { date: addDays(today, 2), meal: 'midi' },
          { date: addDays(today, 2), meal: 'soir' }
        ].map(item => ({
          ...item,
          plan: plans.find(p => p.date === item.date && p.meal === item.meal)
        }));
        const homeUpcomingTitle = $('#homeUpcomingTitle');
        if (homeUpcomingTitle) {
          homeUpcomingTitle.textContent = showTodayLunch
            ? 'Ce midi, ce soir et demain'
            : 'Ce soir et demain';
        }
        if (showTodayLunch && !window.__mcLunchCutoffTimer) {
          const now = new Date();
          const cutoff = new Date(now);
          cutoff.setHours(14, 0, 0, 0);
          window.__mcLunchCutoffTimer = window.setTimeout(() => {
            window.__mcLunchCutoffTimer = null;
            renderHome();
          }, Math.max(1000, cutoff.getTime() - now.getTime()));
        }`;

      source = source.slice(0, upcomingStart)
        + replacement
        + '\n        '
        + source.slice(upcomingBoundary);
      checks.push({ label: 'bloc upcoming de l’accueil', ok: true });
    }
  }


  /* 3. Inclure Ce midi dans l’envoi d’accueil vers Clair Courses avant 14 h. */
  const homeMealPlansStart = source.indexOf('function homeMealPlans()');
  const homeMealPlansEnd = homeMealPlansStart < 0
    ? -1
    : source.indexOf('function recipeClairText(', homeMealPlansStart);

  if (homeMealPlansStart < 0 || homeMealPlansEnd < 0) {
    checks.push({ label: 'fonction homeMealPlans', ok: false });
  } else {
    const correctedHomeMealPlans = `function homeMealPlans() {
        const today = todayISO();
        const showTodayLunch = new Date().getHours() < 14;
        const slots = [
          ...(showTodayLunch ? [{ date: today, meal: 'midi' }] : []),
          { date: today, meal: 'soir' },
          { date: addDays(today, 1), meal: 'midi' },
          { date: addDays(today, 1), meal: 'soir' },
          { date: addDays(today, 2), meal: 'midi' },
          { date: addDays(today, 2), meal: 'soir' }
        ];
        return slots.map(slot => getPlan(slot.date, slot.meal)).filter(p => p?.recipeId);
      }

      `;
    source = source.slice(0, homeMealPlansStart)
      + correctedHomeMealPlans
      + source.slice(homeMealPlansEnd);
    checks.push({ label: 'fonction homeMealPlans', ok: true });
  }

  source = source.replace(
    "if (!text) { showToast('Aucun repas n’est prévu ce soir ou demain'); return; }",
    "if (!text) { showToast(new Date().getHours() < 14 ? 'Aucun repas n’est prévu ce midi, ce soir ou demain' : 'Aucun repas n’est prévu ce soir ou demain'); return; }"
  );

  /* 3. Bouton Ce midi dans “Prévoir ce repas”. */
  if (!source.includes('data-schedule-slot="today-lunch"')) {
    replaceExact(
      'bouton Ce midi',
      '<button class="btn btn-primary" type="button" data-schedule-slot="today-evening">Ce soir</button>',
      '<button class="btn btn-primary" type="button" data-schedule-slot="today-lunch">Ce midi</button>\n        <button class="btn btn-primary" type="button" data-schedule-slot="today-evening">Ce soir</button>'
    );
  } else {
    checks.push({ label: 'bouton Ce midi', ok: true });
  }

  /* 4. Conversion du créneau Ce midi en date + repas. */
  const slotFunctionIndex = source.indexOf('function slotToDateMeal(slot)');
  if (slotFunctionIndex < 0) {
    checks.push({ label: 'fonction slotToDateMeal', ok: false });
  } else if (!source.includes("slot === 'today-lunch'", slotFunctionIndex)) {
    insertAfter(
      'créneau today-lunch',
      'const today = todayISO();',
      "\n        if (slot === 'today-lunch') return { date: today, meal: 'midi' };",
      slotFunctionIndex
    );
  } else {
    checks.push({ label: 'créneau today-lunch', ok: true });
  }

  /* 5. Masquage du bouton à partir de 14 h. */
  const openScheduleIndex = source.indexOf('function openScheduleChoice(');
  if (openScheduleIndex < 0) {
    checks.push({ label: 'fonction openScheduleChoice', ok: false });
  } else if (!source.includes('todayLunchButton.hidden', openScheduleIndex)) {
    insertAfter(
      'masquage à 14 h',
      "$('#customSchedulePanel').classList.remove('open');",
      `
        const todayLunchButton = document.querySelector('[data-schedule-slot="today-lunch"]');
        if (todayLunchButton) todayLunchButton.hidden = new Date().getHours() >= 14;`,
      openScheduleIndex
    );
  } else {
    checks.push({ label: 'masquage à 14 h', ok: true });
  }


  /* Liaison structurée : conserver le contrat mcjson natif de Mon Carnet. */
  checks.push({
    label: 'pont structuré vers Clair Courses',
    ok: source.includes('function buildClairTransferContract()')
      && source.includes('target.hash = `mcjson=${encodeURIComponent(json)}`')
      && source.includes("target.searchParams.set('transfer', token)")
  });

  /* Marqueur final, exécuté après les éventuels compléments. */
  const marker = `
<script>
(() => {
  const applyTestIdentity = () => {
    document.title = 'Mon Carnet V2.4.8 TEST';
    const version = document.querySelector('.brand small');
    if (version) version.textContent = 'VERSION · V2.4.8 TEST';
  };
  applyTestIdentity();
  window.setTimeout(applyTestIdentity, 300);
  window.setTimeout(applyTestIdentity, 1200);
})();
<\/script>`;

  const bodyEnd = source.lastIndexOf('</body>');
  if (bodyEnd < 0) {
    checks.push({ label: 'fin du document', ok: false });
  } else {
    source = source.slice(0, bodyEnd) + marker + '\n' + source.slice(bodyEnd);
    checks.push({ label: 'fin du document', ok: true });
  }

  const requiredMarkers = [
    "showTodayLunch = new Date().getHours() < 14",
    'data-schedule-slot="today-lunch"',
    "slot === 'today-lunch'",
    'todayLunchButton.hidden',
    'function homeMealPlans()',
    "showTodayLunch ? [{ date: today, meal: 'midi' }]",
    "target.hash = `mcjson=${encodeURIComponent(json)}`",
    "target.searchParams.set('transfer', token)",
    OFFICIAL_CLAIR_URL,
    'VERSION · V2.4.8 TEST'
  ];

  for (const marker of requiredMarkers) {
    checks.push({ label: `marqueur ${marker}`, ok: source.includes(marker) });
  }

  const failed = checks.filter(item => !item.ok);
  return { source, checks, failed };
}


const stop = (message, details = '') => {
  const boot = document.getElementById('boot');
  boot.classList.add('error');
  boot.innerHTML = `<div class="card"><strong>Test arrêté sans risque</strong><p>${message}</p>${details ? `<pre>${details}</pre>` : ''}</div>`;
};

let original = '';
for (const url of SOURCES) {
  try {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) continue;
    const text = await response.text();
    if (text.includes('function renderHome()') && text.includes('mon-carnet-cuisine-v1')) {
      original = text;
      break;
    }
  } catch (_) {}
}

if (!original) {
  stop('Le fichier officiel n’a pas pu être chargé. Rechargez la page avec une connexion internet.');
  return;
}

const result = patchSource(original);
if (result.failed.length) {
  stop(
    'Une correction ne correspond pas au fichier officiel. Aucune ancienne version ne sera ouverte.',
    result.failed.map(item => `Correction non appliquée : ${item.label}`).join('\n')
  );
  return;
}

document.open();
document.write(result.source);
document.close();
})();
</script>
</body>
</html>
